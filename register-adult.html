<!DOCTYPE html>
<html lang="ko-KR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>성인반 가입 신청서 – 차 태권도</title>
  <meta name="description" content="차 태권도 성인반 온라인 가입 신청서. 차 태권도장에서 도전과 성취를 응원합니다.">
  <link rel="icon" href="https://chataekwondo.com/wp-content/uploads/2025/05/cropped-logo-01-32x32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #fcaf3b; --dark: #14171c; --light: #f8f8f8; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; color: #333; line-height: 1.6; padding-bottom: 56px; background: var(--light); }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; height: auto; display: block; }

    /* NAV */
    .cha-header { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.08); position: sticky; top: 0; z-index: 1000; }
    .cha-nav { display: flex; align-items: center; justify-content: space-between; height: 72px; max-width: 1100px; margin: 0 auto; padding: 0 24px; }
    .cha-logo img { height: 50px; width: auto; }
    .cha-nav-links { display: flex; align-items: center; gap: 24px; }
    .cha-nav-links > a { font-size: 14px; font-weight: 600; color: #333; transition: color .2s; }
    .cha-nav-links > a:hover { color: var(--accent); }
    .cha-nav-dropdown { position: relative; cursor: pointer; font-size: 14px; font-weight: 600; color: #333; }
    .cha-nav-dropdown:hover { color: var(--accent); }
    .cha-dropdown { display: none; position: absolute; top: calc(100% + 12px); left: 0; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.12); border-radius: 10px; min-width: 180px; padding: 8px 0; z-index: 100; } .cha-dropdown::before { content: ""; position: absolute; top: -12px; left: 0; right: 0; height: 12px; }
    .cha-nav-dropdown:hover .cha-dropdown { display: block; }
    .cha-dropdown a { display: block; padding: 10px 20px; font-size: 13px; font-weight: 600; transition: background .15s; }
    .cha-dropdown a:hover { background: var(--light); color: var(--accent); }
    .cha-hamburger { display: none; flex-direction: column; gap: 5px; background: none; border: none; cursor: pointer; padding: 8px; }
    .cha-hamburger span { width: 24px; height: 2px; background: var(--dark); display: block; }
    @media (max-width: 820px) {
      .cha-hamburger { display: flex; }
      .cha-nav-links { display: none; position: absolute; top: 72px; left: 0; right: 0; background: #fff; flex-direction: column; align-items: flex-start; padding: 20px 24px; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,.1); border-top: 1px solid #eee; }
      .cha-nav-links.open { display: flex; }
      .cha-dropdown { position: static; box-shadow: none; border-radius: 0; padding-left: 16px; margin-top: 8px; }
      .cha-nav-dropdown:hover .cha-dropdown { display: none; }
      .cha-nav-dropdown.open .cha-dropdown { display: block; }
    }

    /* PAGE HERO */
    .page-hero { background: var(--dark); color: #fff; padding: 72px 24px 60px; text-align: center; position: relative; overflow: hidden; }
    .page-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(252,175,59,.15) 0%, transparent 60%); }
    .page-hero .emoji { font-size: 48px; margin-bottom: 16px; display: block; }
    .page-hero h1 { font-size: clamp(28px, 4vw, 46px); font-weight: 900; margin-bottom: 14px; position: relative; }
    .page-hero p { font-size: 16px; opacity: .75; max-width: 520px; margin: 0 auto 24px; position: relative; }
    .cross-link { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid rgba(255,255,255,.3); border-radius: 30px; padding: 9px 20px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.8); transition: border-color .2s, color .2s; position: relative; }
    .cross-link:hover { border-color: var(--accent); color: var(--accent); }

    /* FORM AREA */
    .form-area { padding: 56px 24px 72px; }
    .gform-wrap { max-width: 780px; margin: 0 auto; background: #fff; border-radius: 24px; overflow: hidden; box-shadow: 0 4px 32px rgba(0,0,0,.08); }
    .gform-wrap iframe { display: block; width: 100%; min-height: 600px; height: 920px; border: none; }
    @media (max-width: 640px) { .gform-wrap iframe { height: 1100px; } }

    /* FOOTER */
    .cha-footer { background: var(--dark); color: rgba(255,255,255,.55); padding: 48px 24px; text-align: center; font-size: 13px; line-height: 2.2; }
    .cha-footer a { color: var(--accent); }

    /* STICKY BAR */
    .cha-sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 9999; display: flex; height: 56px; box-shadow: 0 -2px 12px rgba(0,0,0,.18); }
    .cha-sticky-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 700; color: #fff; text-decoration: none; font-family: 'Outfit', sans-serif; }
    .cha-sticky-btn.call  { background: #1a73e8; }
    .cha-sticky-btn.kakao { background: #fee500; color: #3c1e1e; }
    .cha-sticky-btn.kids  { background: var(--accent); color: var(--dark); }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="cha-header">
  <nav class="cha-nav">
    <a href="index.html" class="cha-logo">
      <img src="https://chataekwondo.com/wp-content/uploads/2025/05/logo-01.png" alt="차 태권도">
    </a>
    <div class="cha-nav-links" id="navLinks">
      <a href="index.html">HOME</a>
      <div class="cha-nav-dropdown" id="navDropdown"><span onclick="toggleDropdown(event)">도장 소개 ▾</span>
        <div class="cha-dropdown">
          <a href="instructor.html">지도자 소개</a>
          <a href="greeting.html">관장님 인사말</a>
          <a href="philosophy.html">교육 철학</a>
          <a href="facility.html">시설 안내</a>
        </div>
      </div>
      <a href="gallery.html">갤러리</a>
      <a href="contact.html">오시는 길</a>
      <a href="news.html">도장 소식</a>
      <a href="register-adult.html" style="background:var(--accent);color:var(--dark);padding:8px 18px;border-radius:30px;font-weight:800;">가입 신청</a>
    </div>
    <button class="cha-hamburger" onclick="document.getElementById('navLinks').classList.toggle('open')" aria-label="메뉴">
      <span></span><span></span><span></span>
    </button>
  </nav>
</header>

<!-- HERO -->
<section class="page-hero">
  <span class="emoji">🏀</span>
  <h1>성인 반</h1>
  <p>차 태권도장에서 도전과 성취를 응원합니다.</p>
  <a href="register-kids.html" class="cross-link">🐧 어린이 반 신청서는 여기에서 →</a>
</section>

<!-- GOOGLE FORM -->
<div class="form-area">
  <div class="gform-wrap">
    <iframe
      src="https://docs.google.com/forms/d/e/1FAIpQLScdgcn3butZbd9E6VXl70l3EvdvqNlkuAW1Zq-pJgCQDGuWQA/viewform?embedded=true"
      width="100%"
      frameborder="0"
      marginheight="0"
      marginwidth="0"
      title="차 태권도 성인반 가입 신청서"
    >로딩 중…</iframe>
  </div>
</div>

<!-- FOOTER -->
<div id="cha-footer-placeholder"></div>

<!-- STICKY BAR -->
<div class="cha-sticky-bar">
  <a href="tel:01031809209" class="cha-sticky-btn call">📞 전화 상담</a>
  <a href="https://open.kakao.com/o/s4sunKK" class="cha-sticky-btn kakao">💬 카카오 상담</a>
  <a href="register-kids.html" class="cha-sticky-btn kids">🐧 어린이반 신청</a>
</div>

<script src="footer.js"></script>
<script src="animations.js"></script>
<script>
function toggleDropdown(e) {
  if (window.innerWidth > 820) return;
  e.stopPropagation();
  document.getElementById('navDropdown').classList.toggle('open');
}
document.addEventListener('click', function(e) {
  var dd = document.getElementById('navDropdown');
  if (dd && !e.target.closest('#navDropdown')) dd.classList.remove('open');
});
</script>
</body>
</html>
